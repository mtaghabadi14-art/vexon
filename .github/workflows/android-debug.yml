name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Prepare local-first web bundle
        run: npm run app:prepare

      - name: Verify local web bundle
        shell: bash
        run: |
          echo "=== www ==="
          find www -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "=== Required files ==="

          test -f www/index.html
          test -f www/style.css
          test -f www/script.js
          test -f www/vexon-nav.js
          test -d www/assets
          test -d www/sections

          echo "Local PGame web bundle is ready."

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=== Android platforms ==="
          ls -la "$ANDROID_SDK_ROOT/platforms" | head -50 || true

          echo ""
          echo "=== Android build tools ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools" | head -50 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pgame-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error