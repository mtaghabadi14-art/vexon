name: Build PGame Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PGAME_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/pgame-release.keystore

      - name: Create keystore properties
        env:
          STORE_PASSWORD: ${{ secrets.PGAME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PGAME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PGAME_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=pgame-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PGame-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
