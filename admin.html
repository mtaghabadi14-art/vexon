<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <meta
        name="theme-color"
        content="#03040a"
    >

    <title>
        VEXON ADMIN
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           ADMIN PAGE
        ========================================= */

        .admin-page {
            position: relative;
            z-index: 2;
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 60px 0 100px;
        }


        .admin-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 30px;
            padding: 22px 24px;

            border: 1px solid rgba(0, 255, 157, 0.15);
            border-radius: 22px;

            background:
                rgba(6, 10, 18, 0.82);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 0 30px rgba(0, 255, 157, 0.06);
        }


        .admin-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }


        .admin-brand-icon {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,255,157,0.16),
                    rgba(116,77,255,0.16)
                );

            border:
                1px solid
                rgba(0,255,157,0.2);

            font-size: 25px;
        }


        .admin-brand h1 {
            margin: 0;
            font-size: 22px;
        }


        .admin-brand p {
            margin: 4px 0 0;
            opacity: 0.65;
            font-size: 12px;
        }


        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }


        .admin-button {
            border: none;
            border-radius: 12px;

            padding: 11px 16px;

            font-family: inherit;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }


        .admin-button:hover {
            transform:
                translateY(-2px);
        }


        .admin-button-primary {
            color: #04110b;

            background:
                linear-gradient(
                    90deg,
                    #00ff9d,
                    #00eaff
                );
        }


        .admin-button-secondary {
            color: white;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }


        .admin-button-danger {
            color: white;

            background:
                rgba(255, 63, 90, 0.12);

            border:
                1px solid
                rgba(255, 63, 90, 0.18);
        }


        .admin-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;

            margin-bottom: 25px;
        }


        .admin-stat-card {
            padding: 22px;

            border-radius: 20px;

            background:
                rgba(6, 10, 18, 0.74);

            border:
                1px solid
                rgba(255,255,255,0.07);

            backdrop-filter:
                blur(14px);
        }


        .admin-stat-label {
            display: block;

            font-size: 12px;
            opacity: 0.6;

            margin-bottom: 8px;
        }


        .admin-stat-value {
            font-size: 28px;
            font-weight: 900;
        }


        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 20px;
            align-items: start;
        }


        .admin-panel {
            padding: 24px;

            border-radius: 22px;

            background:
                rgba(6, 10, 18, 0.78);

            border:
                1px solid
                rgba(255,255,255,0.07);

            backdrop-filter:
                blur(16px);
        }


        .admin-panel h2 {
            margin:
                0 0 18px;

            font-size: 19px;
        }


        .admin-form {
            display: grid;
            gap: 14px;
        }


        .admin-field {
            display: grid;
            gap: 7px;
        }


        .admin-field label {
            font-size: 12px;
            opacity: 0.72;
        }


        .admin-field input,
        .admin-field textarea,
        .admin-field select {

            width: 100%;
            box-sizing: border-box;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            background:
                rgba(255,255,255,0.045);

            color: white;

            padding: 12px 13px;

            font-family: inherit;
            font-size: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .admin-field textarea {
            min-height: 180px;
            resize: vertical;
        }


        .admin-field input:focus,
        .admin-field textarea:focus,
        .admin-field select:focus {

            border-color:
                rgba(0,255,157,0.42);

            box-shadow:
                0 0 0 3px
                rgba(0,255,157,0.07);
        }


        .admin-form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;

            margin-top: 5px;
        }


        .admin-message {
            display: none;

            padding: 11px 13px;

            border-radius: 12px;

            font-size: 12px;
            line-height: 1.8;
        }


        .admin-message.success {
            display: block;

            color: #b8ffe4;

            background:
                rgba(0,255,157,0.08);

            border:
                1px solid
                rgba(0,255,157,0.14);
        }


        .admin-message.error {
            display: block;

            color: #ffc1c9;

            background:
                rgba(255,63,90,0.08);

            border:
                1px solid
                rgba(255,63,90,0.14);
        }


        .admin-news-list {
            display: grid;
            gap: 12px;
        }


        .admin-news-item {
            padding: 16px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.06);
        }


        .admin-news-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }


        .admin-news-title {
            margin: 0;

            font-size: 15px;
            line-height: 1.7;
        }


        .admin-news-category {
            display: inline-block;

            margin-top: 5px;

            font-size: 10px;
            opacity: 0.55;
        }


        .admin-news-status {
            flex-shrink: 0;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 10px;
            font-weight: 800;
        }


        .admin-news-status.published {

            color: #aaffd9;

            background:
                rgba(0,255,157,0.08);
        }


        .admin-news-status.draft {

            color: #ddd;

            background:
                rgba(255,255,255,0.07);
        }


        .admin-news-preview {
            margin:
                10px 0 0;

            font-size: 12px;
            line-height: 1.9;

            opacity: 0.62;

            display: block;
            max-height: 5.7em;
            overflow: hidden;
        }


        .admin-news-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 12px;

            font-size: 10px;

            opacity: 0.45;
        }


        .admin-news-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            margin-top: 13px;
        }


        .admin-small-button {
            border: none;

            padding: 7px 10px;

            border-radius: 9px;

            font-family: inherit;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            background:
                rgba(255,255,255,0.06);

            color: white;
        }


        .admin-small-button:hover {
            background:
                rgba(255,255,255,0.10);
        }


        .admin-loading,
        .admin-empty {
            padding: 25px;

            text-align: center;

            opacity: 0.55;

            font-size: 12px;
        }


        .admin-hidden {
            display: none !important;
        }


        @media (max-width: 900px) {

            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-dashboard {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .admin-page {
                width: 94%;
                padding-top: 25px;
            }

            .admin-topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-actions {
                width: 100%;
            }

            .admin-button {
                flex: 1;
            }

            .admin-panel {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<div
    class="background-effects"
    aria-hidden="true"
>

    <div class="nebula nebula-purple"></div>
    <div class="nebula nebula-green"></div>
    <div class="nebula nebula-blue"></div>

    <div class="stars stars-one"></div>
    <div class="stars stars-two"></div>
    <div class="stars stars-three"></div>

    <div class="planet planet-purple"></div>
    <div class="planet planet-blue"></div>

</div>


<main
    id="admin-loading"
    class="admin-page"
>

    <div class="admin-panel">

        <div class="admin-loading">
            🔐 در حال بررسی دسترسی ادمین...
        </div>

    </div>

</main>


<main
    id="admin-app"
    class="admin-page admin-hidden"
>

    <!-- =========================
         TOP BAR
    ========================== -->

    <section class="admin-topbar">

        <div class="admin-brand">

            <div class="admin-brand-icon">
                👑
            </div>

            <div>

                <h1>
                    VEXON ADMIN
                </h1>

                <p id="admin-welcome">
                    پنل مدیریت
                </p>

            </div>

        </div>


        <div class="admin-actions">

            <button
                type="button"
                class="admin-button admin-button-secondary"
                id="back-home"
            >
                🏠 سایت
            </button>

            <button
                type="button"
                class="admin-button admin-button-secondary"
                id="refresh-news"
            >
                🔄 بروزرسانی
            </button>

            <button
                type="button"
                class="admin-button admin-button-danger"
                id="admin-logout"
            >
                🚪 خروج
            </button>

        </div>

    </section>


    <!-- =========================
         STATS
    ========================== -->

    <section class="admin-dashboard">

        <div class="admin-stat-card">

            <span class="admin-stat-label">
                📰 کل اخبار
            </span>

            <strong
                class="admin-stat-value"
                id="stat-total"
            >
                0
            </strong>

        </div>


        <div class="admin-stat-card">

            <span class="admin-stat-label">
                ✅ منتشرشده
            </span>

            <strong
                class="admin-stat-value"
                id="stat-published"
            >
                0
            </strong>

        </div>


        <div class="admin-stat-card">

            <span class="admin-stat-label">
                📝 پیش‌نویس
            </span>

            <strong
                class="admin-stat-value"
                id="stat-draft"
            >
                0
            </strong>

        </div>

    </section>


    <!-- =========================
         MAIN ADMIN CONTENT
    ========================== -->

    <section class="admin-layout">


        <!-- =========================
             CREATE / EDIT
        ========================== -->

        <div class="admin-panel">

            <h2 id="form-title">
                📝 خبر جدید
            </h2>


            <form
                id="news-form"
                class="admin-form"
            >

                <input
                    type="hidden"
                    id="news-id"
                >


                <div class="admin-field">

                    <label for="news-title">
                        عنوان خبر
                    </label>

                    <input
                        id="news-title"
                        type="text"
                        maxlength="200"
                        placeholder="مثلاً: آپدیت جدید VEXON منتشر شد"
                        required
                    >

                </div>


                <div class="admin-field">

                    <label for="news-category">
                        دسته‌بندی
                    </label>

                    <select
                        id="news-category"
                    >

                        <option value="general">
                            عمومی
                        </option>

                        <option value="game">
                            بازی
                        </option>

                        <option value="update">
                            بروزرسانی
                        </option>

                        <option value="event">
                            مسابقات
                        </option>

                        <option value="announcement">
                            اطلاعیه
                        </option>

                    </select>

                </div>


                <div class="admin-field">

                    <label for="news-image">
                        آدرس تصویر
                    </label>

                    <input
                        id="news-image"
                        type="url"
                        maxlength="1000"
                        placeholder="https://..."
                    >

                </div>


                <div class="admin-field">

                    <label for="news-content">
                        متن خبر
                    </label>

                    <textarea
                        id="news-content"
                        maxlength="20000"
                        placeholder="متن کامل خبر را بنویس..."
                        required
                    ></textarea>

                </div>


                <div class="admin-field">

                    <label for="news-status">
                        وضعیت
                    </label>

                    <select
                        id="news-status"
                    >

                        <option value="draft">
                            📝 پیش‌نویس
                        </option>

                        <option value="published">
                            ✅ انتشار
                        </option>

                    </select>

                </div>


                <div
                    id="admin-message"
                    class="admin-message"
                ></div>


                <div class="admin-form-actions">

                    <button
                        type="submit"
                        class="admin-button admin-button-primary"
                    >
                        💾 ذخیره خبر
                    </button>


                    <button
                        type="button"
                        id="cancel-edit"
                        class="admin-button admin-button-secondary admin-hidden"
                    >
                        ❌ لغو ویرایش
                    </button>

                </div>

            </form>

        </div>


        <!-- =========================
             NEWS LIST
        ========================== -->

        <div class="admin-panel">

            <h2>
                📰 اخبار
            </h2>


            <div
                id="news-list"
                class="admin-news-list"
            >

                <div class="admin-loading">
                    در حال دریافت اخبار...
                </div>

            </div>

        </div>

    </section>

</main>


<script>

(function () {

    "use strict";


    /* =========================================
       ELEMENTS
    ========================================= */

    const loading =
        document.getElementById(
            "admin-loading"
        );

    const app =
        document.getElementById(
            "admin-app"
        );

    const welcome =
        document.getElementById(
            "admin-welcome"
        );

    const newsForm =
        document.getElementById(
            "news-form"
        );

    const newsId =
        document.getElementById(
            "news-id"
        );

    const newsTitle =
        document.getElementById(
            "news-title"
        );

    const newsCategory =
        document.getElementById(
            "news-category"
        );

    const newsImage =
        document.getElementById(
            "news-image"
        );

    const newsContent =
        document.getElementById(
            "news-content"
        );

    const newsStatus =
        document.getElementById(
            "news-status"
        );

    const formTitle =
        document.getElementById(
            "form-title"
        );

    const message =
        document.getElementById(
            "admin-message"
        );

    const cancelEdit =
        document.getElementById(
            "cancel-edit"
        );

    const newsList =
        document.getElementById(
            "news-list"
        );

    const statTotal =
        document.getElementById(
            "stat-total"
        );

    const statPublished =
        document.getElementById(
            "stat-published"
        );

    const statDraft =
        document.getElementById(
            "stat-draft"
        );

    const backHome =
        document.getElementById(
            "back-home"
        );

    const refreshNews =
        document.getElementById(
            "refresh-news"
        );

    const adminLogout =
        document.getElementById(
            "admin-logout"
        );


    /* =========================================
       STATE
    ========================================= */

    let newsItems = [];


    /* =========================================
       HELPERS
    ========================================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "admin-message " +
            type;

    }


    function hideMessage() {

        message.textContent =
            "";

        message.className =
            "admin-message";

    }


    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function formatDate(
        value
    ) {

        if (!value) {
            return "—";
        }


        try {

            return new Intl.DateTimeFormat(
                "fa-IR",
                {
                    dateStyle:
                        "medium",
                    timeStyle:
                        "short"
                }
            ).format(
                new Date(value)
            );

        } catch {

            return value;

        }

    }


    /* =========================================
       AUTH CHECK
    ========================================= */

    async function checkAdmin() {

        try {

            const response =
                await fetch(
                    "/api/admin/me",
                    {
                        method:
                            "GET",

                        credentials:
                            "same-origin",

                        cache:
                            "no-store"
                    }
                );


            if (
                response.status ===
                401
            ) {

                window.location.href =
                    "sections/login.html";

                return false;

            }


            if (
                response.status ===
                403
            ) {

                loading.innerHTML = `
                    <div class="admin-empty">
                        ❌ این حساب دسترسی Admin ندارد.
                    </div>
                `;

                return false;

            }


            if (!response.ok) {

                throw new Error(
                    "Admin check failed."
                );

            }


            const data =
                await response.json();


            if (
                !data.isAdmin
            ) {

                window.location.href =
                    "index.html";

                return false;

            }


            welcome.textContent =
                `خوش آمدی ${data.username} 👑`;


            loading.classList.add(
                "admin-hidden"
            );


            app.classList.remove(
                "admin-hidden"
            );


            return true;


        } catch (error) {

            console.error(
                "ADMIN_AUTH_ERROR",
                error
            );


            loading.innerHTML = `
                <div class="admin-empty">
                    ❌ ارتباط با سرور برقرار نشد.
                </div>
            `;

            return false;

        }

    }


    /* =========================================
       LOAD NEWS
    ========================================= */

    async function loadNews() {

        newsList.innerHTML = `
            <div class="admin-loading">
                در حال دریافت اخبار...
            </div>
        `;


        try {

            const response =
                await fetch(
                    "/api/admin/news",
                    {
                        method:
                            "GET",

                        credentials:
                            "same-origin",

                        cache:
                            "no-store"
                    }
                );


            if (
                response.status ===
                401
            ) {

                window.location.href =
                    "sections/login.html";

                return;

            }


            if (
                response.status ===
                403
            ) {

                newsList.innerHTML = `
                    <div class="admin-empty">
                        ❌ دسترسی ادمین ندارید.
                    </div>
                `;

                return;

            }


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "خطا در دریافت اخبار."
                );

            }


            newsItems =
                Array.isArray(
                    data.news
                )
                    ? data.news
                    : [];


            renderNews();

            updateStats();


        } catch (error) {

            console.error(
                "NEWS_LOAD_ERROR",
                error
            );


            newsList.innerHTML = `
                <div class="admin-empty">
                    ❌ ${escapeHtml(
                        error.message ||
                        "دریافت اخبار ناموفق بود."
                    )}
                </div>
            `;

        }

    }


    /* =========================================
       RENDER NEWS
    ========================================= */

    function renderNews() {

        if (!newsItems.length) {

            newsList.innerHTML = `
                <div class="admin-empty">
                    📰 هنوز هیچ خبری ساخته نشده.
                </div>
            `;

            return;

        }


        newsList.innerHTML =
            newsItems
                .map(
                    (item) => {

                        const statusClass =
                            item.status ===
                            "published"
                                ? "published"
                                : "draft";


                        const statusText =
                            item.status ===
                            "published"
                                ? "✅ منتشر شده"
                                : "📝 پیش‌نویس";


                        return `
                            <article
                                class="admin-news-item"
                            >

                                <div
                                    class="admin-news-head"
                                >

                                    <div>

                                        <h3
                                            class="admin-news-title"
                                        >
                                            ${escapeHtml(
                                                item.title
                                            )}
                                        </h3>

                                        <span
                                            class="admin-news-category"
                                        >
                                            ${escapeHtml(
                                                item.category ||
                                                "general"
                                            )}
                                        </span>

                                    </div>


                                    <span
                                        class="admin-news-status ${statusClass}"
                                    >
                                        ${statusText}
                                    </span>

                                </div>


                                <p
                                    class="admin-news-preview"
                                >
                                    ${escapeHtml(
                                        item.content
                                    )}
                                </p>


                                <div
                                    class="admin-news-meta"
                                >

                                    <span>
                                        👤 ${escapeHtml(
                                            item.author_username
                                        )}
                                    </span>

                                    <span>
                                        🕒 ${escapeHtml(
                                            formatDate(
                                                item.created_at
                                            )
                                        )}
                                    </span>

                                </div>


                                <div
                                    class="admin-news-actions"
                                >

                                    <button
                                        type="button"
                                        class="admin-small-button"
                                        data-action="edit"
                                        data-id="${item.id}"
                                    >
                                        ✏️ ویرایش
                                    </button>


                                    <button
                                        type="button"
                                        class="admin-small-button"
                                        data-action="toggle"
                                        data-id="${item.id}"
                                    >
                                        ${
                                            item.status === "published"
                                                ? "📝 پیش‌نویس"
                                                : "✅ انتشار"
                                        }
                                    </button>


                                    <button
                                        type="button"
                                        class="admin-small-button"
                                        data-action="delete"
                                        data-id="${item.id}"
                                    >
                                        🗑️ حذف
                                    </button>

                                </div>

                            </article>
                        `;

                    }
                )
                .join("");

    }


    /* =========================================
       UPDATE STATS
    ========================================= */

    function updateStats() {

        const total =
            newsItems.length;


        const published =
            newsItems.filter(
                item =>
                    item.status ===
                    "published"
            ).length;


        const draft =
            newsItems.filter(
                item =>
                    item.status !==
                    "published"
            ).length;


        statTotal.textContent =
            total;


        statPublished.textContent =
            published;


        statDraft.textContent =
            draft;

    }


    /* =========================================
       RESET FORM
    ========================================= */

    function resetForm() {

        newsForm.reset();

        newsId.value =
            "";

        newsStatus.value =
            "draft";

        formTitle.textContent =
            "📝 خبر جدید";

        cancelEdit.classList.add(
            "admin-hidden"
        );

        hideMessage();

    }


    /* =========================================
       EDIT NEWS
    ========================================= */

    function editNews(
        id
    ) {

        const item =
            newsItems.find(
                news =>
                    String(news.id) ===
                    String(id)
            );


        if (!item) {
            return;
        }


        newsId.value =
            item.id;

        newsTitle.value =
            item.title || "";

        newsCategory.value =
            item.category ||
            "general";

        newsImage.value =
            item.image_url ||
            "";

        newsContent.value =
            item.content ||
            "";

        newsStatus.value =
            item.status ||
            "draft";


        formTitle.textContent =
            "✏️ ویرایش خبر";


        cancelEdit.classList.remove(
            "admin-hidden"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        showMessage(
            "خبر برای ویرایش آماده شد.",
            "success"
        );

    }


    /* =========================================
       SAVE NEWS
    ========================================= */

    async function saveNews(
        event
    ) {

        event.preventDefault();


        hideMessage();


        const id =
            newsId.value.trim();


        const payload = {

            title:
                newsTitle.value.trim(),

            content:
                newsContent.value.trim(),

            image_url:
                newsImage.value.trim(),

            category:
                newsCategory.value,

            status:
                newsStatus.value

        };


        if (
            payload.title.length < 3
        ) {

            showMessage(
                "عنوان خبر خیلی کوتاه است.",
                "error"
            );

            return;

        }


        if (
            payload.content.length < 3
        ) {

            showMessage(
                "متن خبر خالی است.",
                "error"
            );

            return;

        }


        try {

            const isEditing =
                Boolean(id);


            const response =
                await fetch(
                    isEditing
                        ? `/api/admin/news/${encodeURIComponent(
                            id
                          )}`
                        : "/api/admin/news",
                    {
                        method:
                            isEditing
                                ? "PUT"
                                : "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "ذخیره خبر ناموفق بود."
                );

            }


            showMessage(
                data.message ||
                "خبر ذخیره شد.",
                "success"
            );


            if (!isEditing) {

                resetForm();

            } else {

                formTitle.textContent =
                    "📝 خبر جدید";

                newsId.value = "";

                cancelEdit.classList.add(
                    "admin-hidden"
                );

            }


            await loadNews();


        } catch (error) {

            console.error(
                "NEWS_SAVE_ERROR",
                error
            );


            showMessage(
                error.message ||
                "خطایی رخ داد.",
                "error"
            );

        }

    }


    /* =========================================
       TOGGLE STATUS
    ========================================= */

    async function toggleNews(
        id
    ) {

        const item =
            newsItems.find(
                news =>
                    String(news.id) ===
                    String(id)
            );


        if (!item) {
            return;
        }


        const newStatus =
            item.status ===
            "published"
                ? "draft"
                : "published";


        try {

            const response =
                await fetch(
                    `/api/admin/news/${encodeURIComponent(
                        id
                    )}`,
                    {
                        method:
                            "PUT",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                status:
                                    newStatus
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "تغییر وضعیت ناموفق بود."
                );

            }


            await loadNews();


        } catch (error) {

            console.error(
                "NEWS_STATUS_ERROR",
                error
            );


            showMessage(
                error.message ||
                "خطایی رخ داد.",
                "error"
            );

        }

    }


    /* =========================================
       DELETE NEWS
    ========================================= */

    async function deleteNews(
        id
    ) {

        const item =
            newsItems.find(
                news =>
                    String(news.id) ===
                    String(id)
            );


        if (!item) {
            return;
        }


        const confirmed =
            window.confirm(
                `آیا مطمئنی می‌خواهی خبر «${item.title}» حذف شود؟`
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/admin/news/${encodeURIComponent(
                        id
                    )}`,
                    {
                        method:
                            "DELETE",

                        credentials:
                            "same-origin"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "حذف خبر ناموفق بود."
                );

            }


            await loadNews();


            if (
                String(
                    newsId.value
                ) ===
                String(id)
            ) {

                resetForm();

            }


        } catch (error) {

            console.error(
                "NEWS_DELETE_ERROR",
                error
            );


            showMessage(
                error.message ||
                "خطایی هنگام حذف رخ داد.",
                "error"
            );

        }

    }


    /* =========================================
       NEWS ACTIONS
    ========================================= */

    newsList.addEventListener(
        "click",
        (event) => {

            const button =
                event.target.closest(
                    "[data-action]"
                );


            if (!button) {
                return;
            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if (
                action === "edit"
            ) {

                editNews(id);

            }


            if (
                action === "toggle"
            ) {

                toggleNews(id);

            }


            if (
                action === "delete"
            ) {

                deleteNews(id);

            }

        }
    );


    /* =========================================
       FORM
    ========================================= */

    newsForm.addEventListener(
        "submit",
        saveNews
    );


    cancelEdit.addEventListener(
        "click",
        resetForm
    );


    /* =========================================
       REFRESH
    ========================================= */

    refreshNews.addEventListener(
        "click",
        loadNews
    );


    /* =========================================
       HOME
    ========================================= */

    backHome.addEventListener(
        "click",
        () => {

            window.location.href =
                "index.html";

        }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    adminLogout.addEventListener(
        "click",
        async () => {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method:
                            "POST",

                        credentials:
                            "same-origin"
                    }
                );

            } catch (error) {

                console.error(
                    "ADMIN_LOGOUT_ERROR",
                    error
                );

            } finally {

                window.location.href =
                    "sections/login.html";

            }

        }
    );


    /* =========================================
       START
    ========================================= */

    (async function start() {

        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {
            return;
        }


        await loadNews();

    })();

})();

</script>

</body>
</html>
