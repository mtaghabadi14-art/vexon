<!DOCTYPE html>
<html dir="rtl" lang="fa">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <meta content="noindex,nofollow" name="robots"/>
  <title>
   PGame ADMIN
  </title>
  <link href="style.css" rel="stylesheet"/>
  <style>
   .admin-page{position:relative;z-index:2;width:min(1200px,92%);margin:0 auto;padding:30px 0}.admin-topbar,.admin-panel{background:rgba(6,10,18,.78);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:18px}.admin-topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-button{border:0;border-radius:11px;padding:10px 13px;cursor:pointer}.admin-button-primary{background:linear-gradient(90deg,#00ff9d,#00eaff);color:#03110c}.admin-button-secondary{background:rgba(255,255,255,.06);color:#fff}.admin-button-danger{background:rgba(255,63,90,.12);color:#fff}.admin-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.admin-tab{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#fff;padding:11px;border-radius:13px}.admin-tab.active{border-color:rgba(0,255,157,.24);background:rgba(0,255,157,.08)}.admin-section{display:none}.admin-section.active{display:block}.admin-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.admin-form{display:grid;gap:9px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#fff}.admin-form textarea{min-height:180px}.admin-list{display:grid;gap:10px}.admin-item{padding:13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.admin-topbar{flex-direction:column;align-items:stretch}}@media(max-width:650px){.admin-tabs{grid-template-columns:1fr}}
  </style>
 </head>
 <body>
  <div class="background-effects">
   <div class="nebula nebula-purple">
   </div>
   <div class="nebula nebula-green">
   </div>
   <div class="nebula nebula-blue">
   </div>
  </div>
  <main class="admin-page" id="admin-loading">
   <div class="admin-panel">
    🔐 در حال بررسی دسترسی ادمین...
   </div>
  </main>
  <main class="admin-page" id="admin-app" style="display:none">
   <section class="admin-topbar">
    <div>
     <h1 style="margin:0;font-size:22px">
      PGame ADMIN
     </h1>
     <p id="admin-welcome" style="margin:4px 0 0;color:#89899d;font-size:11px">
     </p>
    </div>
    <div class="admin-actions">
     <button class="admin-button admin-button-secondary" id="back-home">
      🏠 سایت
     </button>
     <button class="admin-button admin-button-secondary" id="refresh-current">
      🔄 بروزرسانی
     </button>
     <button class="admin-button admin-button-danger" id="admin-logout">
      🚪 خروج
     </button>
    </div>
   </section>
   <nav class="admin-tabs">
    <button class="admin-tab active" data-section="news">
     📰 اخبار
    </button>
    <button class="admin-tab" data-section="ban">
     🚫 بن کردن
    </button>
    <button class="admin-tab" data-section="support">
     💬 پیام&zwnj;ها
    </button>
   </nav>
   <section class="admin-section active" id="section-news">
    <div class="admin-grid">
     <div class="admin-panel">
      <h2>
       📝 خبر جدید
      </h2>
      <form class="admin-form" id="news-form">
       <input id="news-id" type="hidden"/>
       <input id="news-title" placeholder="عنوان خبر" required=""/>
       <select id="news-category">
        <option value="general">
         عمومی
        </option>
        <option value="game">
         بازی
        </option>
        <option value="update">
         بروزرسانی
        </option>
        <option value="event">
         مسابقات
        </option>
        <option value="announcement">
         اطلاعیه
        </option>
       </select>
       <input id="news-image" placeholder="آدرس تصویر" type="url"/>
       <textarea id="news-content" placeholder="متن خبر" required=""></textarea>
       <select id="news-status">
        <option value="draft">
         📝 پیش&zwnj;نویس
        </option>
        <option value="published">
         ✅ انتشار
        </option>
       </select>
       <button class="admin-button admin-button-primary">
        💾 ذخیره خبر
       </button>
      </form>
     </div>
     <div class="admin-panel">
      <h2>
       📰 اخبار PGame
      </h2>
      <div class="admin-list" id="news-list">
       در حال دریافت...
      </div>
     </div>
    </div>
   </section>
   <section class="admin-section" id="section-ban">
    <div class="admin-panel">
     <h2>
      🚫 مدیریت کاربران
     </h2>
     <div class="admin-list" id="user-list">
      در حال دریافت...
     </div>
    </div>
   </section>
   <section class="admin-section" id="section-support">
    <div class="admin-panel">
     <h2>
      💬 پیام&zwnj;های کاربران
     </h2>
     <div class="admin-list" id="support-list">
      در حال دریافت...
     </div>
    </div>
   </section>
  </main>
  <script>
   (async()=>{const loading=document.getElementById('admin-loading'),app=document.getElementById('admin-app');let section='news',news=[],users=[],supports=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function admin(){const r=await fetch('/api/admin/me',{cache:'no-store'});if(r.status===401)return location.href='sections/login.html';if(!r.ok){loading.textContent='❌ دسترسی ادمین ندارید.';return false}const d=await r.json();if(!d.isAdmin)return false;document.getElementById('admin-welcome').textContent=`خوش آمدی ${d.username} 👑`;loading.style.display='none';app.style.display='block';return true}async function loadNews(){const r=await fetch('/api/admin/news',{cache:'no-store'}),d=await r.json();news=d.news||[];document.getElementById('news-list').innerHTML=news.map(n=>`<article class="admin-item"><b>${esc(n.title)}</b><div style="font-size:10px;opacity:.5;margin-top:5px">${esc(n.category||'general')} • ${n.status==='published'?'✅ منتشر شده':'📝 پیش‌نویس'}</div><p style="font-size:11px;line-height:1.9;opacity:.7">${esc(n.content)}</p><button class="admin-button admin-button-secondary" data-edit="${n.id}">✏️ ویرایش</button><button class="admin-button admin-button-secondary" data-toggle="${n.id}">${n.status==='published'?'📝 پیش‌نویس':'✅ انتشار'}</button><button class="admin-button admin-button-danger" data-delete="${n.id}">🗑️ حذف</button></article>`).join('')||'هنوز خبری ساخته نشده.'}async function loadUsers(){const r=await fetch('/api/admin/users'),d=await r.json();users=d.users||[];document.getElementById('user-list').innerHTML=users.map(u=>`<article class="admin-item"><b>👤 ${esc(u.username)}</b><div style="font-size:10px;opacity:.5">ID: ${u.id} • LV ${u.level??1} • XP ${u.xp??0} • 🪙 ${u.coins??0}</div>${Number(u.ban_active)===1?`<p style="color:#ffc0c8;font-size:10px">🚫 ${esc(u.ban_reason||'محدودیت فعال')} • ${esc(u.ban_type||'full')}</p><button class="admin-button admin-button-secondary" data-unban="${u.id}">✅ رفع محدودیت</button>`:`<button class="admin-button admin-button-danger" data-ban="${u.id}">🚫 بن ۲۴ ساعته</button>`}</article>`).join('')||'کاربری وجود ندارد.'}async function loadSupport(){const r=await fetch('/api/admin/support'),d=await r.json();supports=d.messages||[];document.getElementById('support-list').innerHTML=supports.map(s=>`<article class="admin-item"><b>👤 ${esc(s.username)}</b><div style="font-size:10px;opacity:.5">${esc(s.created_at)}</div><p style="font-size:11px">${esc(s.message)}</p>${s.reply?`<div style="font-size:10px;color:#b8ffe4">👑 ${esc(s.reply)}</div>`:''}<form data-reply="${s.id}" style="display:grid;gap:7px;margin-top:8px"><textarea placeholder="پاسخ" style="width:100%;min-height:70px">${esc(s.reply||'')}</textarea><button class="admin-button admin-button-primary">${s.reply?'✏️ بروزرسانی':'🚀 ارسال پاسخ'}</button></form></article>`).join('')||'پیامی دریافت نشده.'}async function refresh(){if(section==='news')await loadNews();if(section==='ban')await loadUsers();if(section==='support')await loadSupport()}document.querySelectorAll('.admin-tab').forEach(t=>t.onclick=async()=>{document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');section=t.dataset.section;document.querySelectorAll('.admin-section').forEach(x=>x.classList.toggle('active',x.id==='section-'+section));await refresh()});document.getElementById('news-form').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('news-id').value,p={title:document.getElementById('news-title').value,content:document.getElementById('news-content').value,image_url:document.getElementById('news-image').value,category:document.getElementById('news-category').value,status:document.getElementById('news-status').value};await fetch(id?'/api/admin/news/'+id:'/api/admin/news',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});e.target.reset();document.getElementById('news-id').value='';await loadNews()};document.getElementById('news-list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.toggle||b.dataset.delete;if(b.dataset.edit){const n=news.find(x=>String(x.id)===String(id));if(n){document.getElementById('news-id').value=n.id;document.getElementById('news-title').value=n.title;document.getElementById('news-content').value=n.content;document.getElementById('news-image').value=n.image_url||'';document.getElementById('news-category').value=n.category||'general';document.getElementById('news-status').value=n.status}}else if(b.dataset.toggle){const n=news.find(x=>String(x.id)===String(id));await fetch('/api/admin/news/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:n.status==='published'?'draft':'published'})});await loadNews()}else if(b.dataset.delete){if(confirm('حذف شود؟')){await fetch('/api/admin/news/'+id,{method:'DELETE'});await loadNews()}}};document.getElementById('user-list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.unban){await fetch('/api/admin/users/'+b.dataset.unban+'/unban',{method:'POST'});await loadUsers()}if(b.dataset.ban){await fetch('/api/admin/users/'+b.dataset.ban+'/ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ban_type:'full',banned_until:new Date(Date.now()+86400000).toISOString(),reason:'نقض قوانین PGame'})});await loadUsers()}};document.getElementById('support-list').onsubmit=async e=>{const f=e.target.closest('form');if(!f)return;e.preventDefault();await fetch('/api/admin/support/'+f.dataset.reply+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:f.querySelector('textarea').value})});await loadSupport()};document.getElementById('refresh-current').onclick=refresh;document.getElementById('back-home').onclick=()=>location.href='index.html';document.getElementById('admin-logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='sections/login.html'};if(await admin()){await refresh()}})()
  </script>
 </body>
</html>
