<!-- =====================================================
     LOGIN API
===================================================== -->

<script>

const loginForm =
    document.getElementById(
        "login-form"
    );


loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const username =
            document
                .getElementById(
                    "login-username"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "login-password"
                )
                .value;


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                alert(
                    data.message ||
                    "ورود ناموفق بود."
                );

                return;

            }


            alert(
                "خوش آمدی " +
                data.username +
                " 💚"
            );


            window.location.href =
                "profile.html";


        } catch (
            error
        ) {

            console.error(
                "LOGIN_ERROR",
                error
            );


            alert(
                "ارتباط با سرور برقرار نشد."
            );

        }

    }
);

</script>
