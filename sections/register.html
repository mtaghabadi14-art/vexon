            </span>

            >

                وارد دنیای VEXON شو و رقابتت را شروع کن.

            </p>


            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form
                class="auth-form"
            >


                <!-- USERNAME -->

                <label
                    for="register-username"
                >
                    نام کاربری
                </label>


                <div
                    class="auth-input-wrap"
                >

                    <span>
                        👤
                    </span>


                    <input
                        id="register-username"
                        type="text"
                        name="username"
                        placeholder="مثلاً VEXON_Player"
                        autocomplete="username"
                        minlength="3"
                        maxlength="20"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <label
                    for="register-password"
                >
                    رمز عبور
                </label>


                <div
                    class="auth-input-wrap"
                >

                    <span>
                        🔒
                    </span>


                    <input
                        id="register-password"
                        type="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کن"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <label
                    for="register-confirm-password"
                >
                    تکرار رمز عبور
                </label>


                <div
                    class="auth-input-wrap"
                >

                    <span>
                        🛡️
                    </span>


                    <input
                        id="register-confirm-password"
                        type="password"
                        name="confirmPassword"
                        placeholder="رمز عبور را دوباره وارد کن"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    🚀 ساخت حساب
                </button>

            </form>


            <!-- =================================================
                 DIVIDER
            ================================================== -->

                class="auth-divider"
            >

                    حساب داری؟

<!-- =====================================================
     REGISTER API
===================================================== -->

<script>

const registerForm =
    document.querySelector(
        ".auth-form"
    );


registerForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const username =
            document
                .getElementById(
                    "register-username"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "register-password"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "register-confirm-password"
                )
                .value;


        if (
            password !==
            confirmPassword
        ) {

            alert(
                "تکرار رمز عبور درست نیست."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                alert(
                    data.message ||
                    "ثبت‌نام ناموفق بود."
                );

                return;

            }


            alert(
                data.message ||
                "حساب با موفقیت ساخته شد."
            );


            window.location.href =
                "login.html";


        } catch (
            error
        ) {

            console.error(
                "REGISTER_ERROR",
                error
            );


            alert(
                "ارتباط با سرور برقرار نشد."
            );

        }

    }
);

</script>
