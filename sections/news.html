        /* =================================================
           NEWS
        ================================================= */

        .news-page {

            position:
                relative;

            z-index:
                2;

        }


        /* =================================================
           REMOVE OLD MOBILE NAV
        ================================================= */

        .mobile-bottom-nav {

            display:
                none !important;

        }


        /* =================================================
           NEWS LIST
        ================================================= */

        .news-list {

            display:
                grid;

            gap:
                18px;

        }


        .news-item {

            position:
                relative;

            overflow:
                hidden;

        }


        .news-clickable {

            display:
                block;

            color:
                inherit;

            text-decoration:
                none;

            cursor:
                pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;

        }


        .news-clickable:hover {

            transform:
                translateY(-3px);

        }


        .news-clickable:active {

            transform:
                scale(.99);

        }


        .news-item-image {

            width:
                100%;

            max-height:
                260px;

            object-fit:
                cover;

            display:
                block;

            margin-bottom:
                16px;

            border-radius:
                16px;

        }


        .news-item-content {

            min-width:
                0;

        }


        .news-item-title {

            margin:
                0 0 8px;

        }


        .news-item-text {

            white-space:
                pre-line;

            line-height:
                2;

            opacity:
                .82;

        }


        .news-item-meta {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                8px 14px;

            margin-top:
                12px;

            font-size:
                11px;

            opacity:
                .5;

        }


        .news-empty,
        .news-loading {

            text-align:
                center;

            padding:
                40px 20px;

            opacity:
                .6;

        }


        .news-error {

            text-align:
                center;

            padding:
                30px 20px;

            color:
                #ffc0c8;

            background:
                rgba(
                    255,
                    60,
                    90,
                    .06
                );

            border:
                1px solid
                rgba(
                    255,
                    60,
                    90,
                    .12
                );

            border-radius:
                18px;

        }


        .news-image-placeholder {

            min-height:
                100px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                16px;

            border-radius:
                16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        0,
                        255,
                        157,
                        .05
                    ),
                    rgba(
                        110,
                        70,
                        255,
                        .08
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

            font-size:
                34px;

            opacity:
                .7;

        }


        /* =================================================
           REACTIONS
        ================================================= */

        .news-reactions {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                7px;

            margin-top:
                16px;

            padding-top:
                13px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

        }


        .news-reaction {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            min-width:
                48px;

            justify-content:
                center;

            padding:
                7px 9px;

            border-radius:
                999px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    .035
                );

            color:
                white;

            font-family:
                inherit;

            font-size:
                12px;

            cursor:
                pointer;

            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease,
                box-shadow .18s ease;

        }


        .news-reaction:hover {

            transform:
                translateY(-2px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    .07
                );

        }


        .news-reaction.active {

            border-color:
                rgba(
                    0,
                    255,
                    157,
                    .36
                );

            background:
                rgba(
                    0,
                    255,
                    157,
                    .09
                );

            box-shadow:
                0 0 14px
                rgba(
                    0,
                    255,
                    157,
                    .08
                );

        }


        .news-reaction:disabled {

            opacity:
                .55;

            cursor:
                not-allowed;

            transform:
                none;

        }


        .news-reaction-count {

            min-width:
                12px;

            text-align:
                center;

            opacity:
                .8;

        }


        .news-reaction-login {

            margin-top:
                8px;

            width:
                100%;

            font-size:
                10px;

            opacity:
                .48;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 900px
        ) {

            .news-page .section {

                margin-top:
                    35px;

            }

        }


    </style>

<script>

(function () {

    "use strict";


    const newsList =
        document.getElementById(
            "news-list"
        );


    if (
        !newsList
    ) {

        return;

    }


    let lastNewsSignature =
        "";


    let newsUpdateTimer =
        null;


    /* =====================================================
       LOGIN STATE
    ===================================================== */

    let loggedIn =
        false;


    let myReactions =
        {};


    /* =====================================================
       REACTIONS
    ===================================================== */

    const reactions = [

        {
            key:
                "love",

            emoji:
                "❤️",

            title:
                "عاشقش شدم"
        },


        {
            key:
                "like",

            emoji:
                "👍",

            title:
                "پسندیدم"
        },


        {
            key:
                "laugh",

            emoji:
                "😂",

            title:
                "خنده‌دار"
        },


        {
            key:
                "wow",

            emoji:
                "😮",

            title:
                "واو"
        },


        {
            key:
                "angry",

            emoji:
                "😡",

            title:
                "عصبانی"
        },


        {
            key:
                "dislike",

            emoji:
                "👎",

            title:
                "نپسندیدم"
        }

    ];


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(
        value
    ) {

        if (
            !value
        ) {

            return "";

        }


        try {

            return new Intl.DateTimeFormat(
                "fa-IR",
                {
                    dateStyle:
                        "medium"
                }
            ).format(
                new Date(
                    value
                )
            );

        } catch {

            return "";

        }

    }


    /* =====================================================
       CATEGORY ICON
    ===================================================== */

    function categoryIcon(
        category
    ) {

        const icons = {

            general:
                "📢",

            game:
                "🎮",

            update:
                "🔄",

            event:
                "🏆",

            announcement:
                "📣"

        };


        return (
            icons[category] ||
            "📢"
        );

    }


    /* =====================================================
       CATEGORY COLOR
    ===================================================== */

    function categoryClass(
        category
    ) {

        const classes = {

            general:
                "red",

            game:
                "purple",

            update:
                "green",

            event:
                "gold",

            announcement:
                "blue"

        };


        return (
            classes[category] ||
            "red"
        );

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function checkLogin() {

        try {

            const response =
                await fetch(
                    "/api/me",
                    {
                        method:
                            "GET",

                        credentials:
                            "same-origin",

                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                loggedIn =
                    false;

                return;

            }


            const data =
                await response.json();


            loggedIn =
                Boolean(
                    data &&
                    data.loggedIn &&
                    data.user
                );

        } catch {

            loggedIn =
                false;

        }

    }


    /* =====================================================
       NEWS SIGNATURE
    ===================================================== */

    function createSignature(
        news
    ) {

        return news
            .map(
                item =>
                    [
                        item.id,
                        item.updated_at,
                        item.published_at,
                        JSON.stringify(
                            item.reactions ||
                            {}
                        )

                    ].join(":")
            )
            .join("|");

    }


    /* =====================================================
       REACTION BUTTONS
    ===================================================== */

    function renderReactionButtons(
        item
    ) {

        const reactionCounts =
            item.reactions ||
            {};


        const currentReaction =
            myReactions[item.id] ||
            null;


        const buttons =
            reactions
                .map(
                    reaction => {

                        const count =
                            Number(
                                reactionCounts[
                                    reaction.key
                                ] ||
                                0
                            );


                        const active =
                            currentReaction ===
                            reaction.key;


                        return `

                            <button
                                type="button"
                                class="
                                    news-reaction
                                    ${
                                        active
                                            ? "active"
                                            : ""
                                    }
                                "
                                data-reaction="${
                                    reaction.key
                                }"
                                data-news-id="${
                                    item.id
                                }"
                                title="${
                                    reaction.title
                                }"
                                ${
                                    !loggedIn
                                        ? "disabled"
                                        : ""
                                }
                            >

                                <span>
                                    ${reaction.emoji}
                                </span>


                                <span
                                    class="news-reaction-count"
                                >
                                    ${count}
                                </span>

                            </button>

                        `;

                    }
                )
                .join("");


        return `

            <div
                class="news-reactions"
                data-reactions-for="${item.id}"
            >

                ${buttons}


                ${
                    !loggedIn

                        ? `

                            <div
                                class="news-reaction-login"
                            >

                                برای ثبت واکنش،
                                وارد حساب VEXON شو.

                            </div>

                          `

                        : ""

                }

            </div>

        `;

    }


    /* =====================================================
       RENDER NEWS
    ===================================================== */

    function renderNews(
        news
    ) {

        if (
            !news.length
        ) {

            newsList.innerHTML = `

                <div
                    class="news-empty"
                >

                    📰
                    هنوز خبری منتشر نشده است.

                </div>

            `;

            return;

        }


        newsList.innerHTML =
            news
                .map(
                    item => {

                        const category =
                            item.category ||
                            "general";


                        const icon =
                            categoryIcon(
                                category
                            );


                        const colorClass =
                            categoryClass(
                                category
                            );


                        const image =
                            item.image_url

                                ? `

                                    <img
                                        class="news-item-image"
                                        src="${escapeHtml(
                                            item.image_url
                                        )}"
                                        alt="${escapeHtml(
                                            item.title
                                        )}"
                                        loading="lazy"
                                        onerror="
                                            this.outerHTML =
                                            '<div class=&quot;news-image-placeholder&quot;>📢</div>';
                                        "
                                    >

                                  `

                                : `

                                    <div
                                        class="
                                            news-image-placeholder
                                        "
                                    >
                                        ${icon}
                                    </div>

                                  `;


                        const date =
                            formatDate(
                                item.published_at ||
                                item.created_at
                            );


                        return `

                            <article
                                class="news-item"
                            >

                                <a
                                    class="news-clickable"
                                    href="
                                        news-detail.html?id=${
                                            encodeURIComponent(
                                                item.id
                                            )
                                        }
                                    "
                                >

                                    ${image}


                                    <div
                                        class="
                                            news-icon
                                            ${colorClass}
                                        "
                                    >
                                        ${icon}
                                    </div>


                                    <div
                                        class="
                                            news-item-content
                                        "
                                    >

                                        <h3
                                            class="
                                                news-item-title
                                            "
                                        >
                                            ${escapeHtml(
                                                item.title
                                            )}
                                        </h3>


                                        <p
                                            class="
                                                news-item-text
                                            "
                                        >
                                            ${escapeHtml(
                                                item.content
                                            )}
                                        </p>


                                        <div
                                            class="
                                                news-item-meta
                                            "
                                        >

                                            <span>
                                                🏷️
                                                ${escapeHtml(
                                                    category
                                                )}
                                            </span>


                                            ${
                                                item.author_username

                                                    ? `

                                                        <span>
                                                            👤
                                                            ${escapeHtml(
                                                                item.author_username
                                                            )}
                                                        </span>

                                                      `

                                                    : ""

                                            }


                                            ${
                                                date

                                                    ? `

                                                        <span>
                                                            📅
                                                            ${escapeHtml(
                                                                date
                                                            )}
                                                        </span>

                                                      `

                                                    : ""

                                            }

                                        </div>

                                    </div>

                                </a>


                                ${renderReactionButtons(
                                    item
                                )}

                            </article>

                        `;

                    }
                )
                .join("");

    }


    /* =====================================================
       LOAD NEWS
    ===================================================== */

    async function loadNews(
        silent = false
    ) {

        if (
            !silent &&
            !lastNewsSignature
        ) {

            newsList.innerHTML = `

                <div
                    class="news-loading"
                >

                    ⏳
                    در حال دریافت آخرین اخبار VEXON...

                </div>

            `;

        }


        try {

            const response =
                await fetch(
                    "/api/news?limit=50",
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "NEWS_API_ERROR"
                );

            }


            const data =
                await response.json();


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    "NEWS_DATA_ERROR"
                );

            }


            const news =
                Array.isArray(
                    data.news
                )
                    ? data.news
                    : [];


            const signature =
                createSignature(
                    news
                );


            if (
                signature ===
                lastNewsSignature
            ) {

                return;

            }


            lastNewsSignature =
                signature;


            renderNews(
                news
            );

        } catch (
            error
        ) {

            console.error(
                "VEXON_NEWS_ERROR:",
                error
            );


            if (
                !lastNewsSignature
            ) {

                newsList.innerHTML = `

                    <div
                        class="news-error"
                    >

                        ❌
                        ارتباط با سرور اخبار برقرار نشد.

                        <br><br>

                        لطفاً چند لحظه دیگر دوباره امتحان کن.

                    </div>

                `;

            }

        }

    }


    /* =====================================================
       REACTION CLICK
    ===================================================== */

    newsList.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    ".news-reaction"
                );


            if (
                !button
            ) {

                return;

            }


            event.preventDefault();


            event.stopPropagation();


            if (
                !loggedIn
            ) {

                window.location.href =
                    "login.html";

                return;

            }


            const newsId =
                button.dataset.newsId;


            const reaction =
                button.dataset.reaction;


            if (
                !newsId ||
                !reaction
            ) {

                return;

            }


            const allButtons =
                newsList.querySelectorAll(
                    `[data-news-id="${CSS.escape(
                        newsId
                    )}"]`
                );


            allButtons.forEach(
                item => {

                    item.disabled =
                        true;

                }
            );


            try {

                const response =
                    await fetch(
                        `/api/news/${encodeURIComponent(
                            newsId
                        )}/reaction`,
                        {
                            method:
                                "POST",

                            credentials:
                                "same-origin",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({
                                    reaction
                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status ===
                    401
                ) {

                    window.location.href =
                        "login.html";

                    return;

                }


                if (
                    response.status ===
                    403
                ) {

                    alert(
                        data.message ||
                        "این حساب اجازه واکنش دادن ندارد."
                    );

                    return;

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "ثبت واکنش ناموفق بود."
                    );

                }


                myReactions[newsId] =
                    data.my_reaction ||
                    null;


                const reactionContainer =
                    newsList.querySelector(
                        `[data-reactions-for="${CSS.escape(
                            newsId
                        )}"]`
                    );


                if (
                    reactionContainer
                ) {

                    reactions.forEach(
                        item => {

                            const reactionButton =
                                reactionContainer.querySelector(
                                    `[data-reaction="${item.key}"]`
                                );


                            if (
                                !reactionButton
                            ) {

                                return;

                            }


                            const count =
                                Number(
                                    data.reactions?.[
                                        item.key
                                    ] ||
                                    0
                                );


                            const countElement =
                                reactionButton.querySelector(
                                    ".news-reaction-count"
                                );


                            if (
                                countElement
                            ) {

                                countElement.textContent =
                                    count;

                            }


                            reactionButton.classList.toggle(
                                "active",
                                data.my_reaction ===
                                    item.key
                            );

                        }
                    );

                }


                lastNewsSignature =
                    "";

            } catch (
                error
            ) {

                console.error(
                    "NEWS_REACTION_ERROR:",
                    error
                );


                alert(
                    error.message ||
                    "ثبت واکنش انجام نشد."
                );

            } finally {

                allButtons.forEach(
                    item => {

                        item.disabled =
                            !loggedIn;

                    }
                );

            }

        }
    );


    /* =====================================================
       FIRST LOAD
    ===================================================== */

    (async function start() {

        await checkLogin();

        await loadNews();

    })();


    /* =====================================================
       LIVE UPDATE
    ===================================================== */

    newsUpdateTimer =
        setInterval(
            async () => {

                await checkLogin();

                await loadNews(
                    true
                );

            },
            10000
        );


    /* =====================================================
       VISIBILITY
    ===================================================== */

    document.addEventListener(
        "visibilitychange",
        async () => {

            if (
                document.visibilityState ===
                "visible"
            ) {

                await checkLogin();

                await loadNews(
                    true
                );

            }

        }
    );


    /* =====================================================
       FOCUS
    ===================================================== */

    window.addEventListener(
        "focus",
        async () => {

            await checkLogin();

            await loadNews(
                true
            );

        }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (
                newsUpdateTimer
            ) {

                clearInterval(
                    newsUpdateTimer
                );

            }

        }
    );

})();

</script>
