        ================================================= */

        .leaderboard-title {

        }


        .leaderboard-label {

            display:

        /* =================================================
           TABS
        ================================================= */

        .leaderboard-tabs {

            display:

        .leaderboard-tab {

                13px;

            font-weight:
                800;

        }

                    rgba(

                        255,

                        77,
                        255,
                        .08
                    )

                    0,
                    255,
                    157,
                    .07
                );

        }


        /* =================================================
           PANEL
        ================================================= */

        .leaderboard-panel {

            padding:
                20px;

            border-radius:
                24px;

            background:
                rgba(

                    255,
                    255,
                    255,
                    .07
                );

            backdrop-filter:

                    18px

                0 0 35px

                    0,
                    0,
                    0,
                    .18
                );

        }


        /* =================================================
           TABLE HEADER
        ================================================= */

        .leaderboard-header {

            display:
                grid;

            grid-template-columns:
                78px
                1fr
                160px;

            gap:
                12px;

            align-items:
                center;

            padding:
                10px 14px 13px;

            margin-bottom:
                7px;

            font-size:
                10px;

        /* =================================================

            display:
                grid;

            gap:
                8px;

        }


        .leaderboard-row {

            display:

                12px;

        /* =================================================

<script>

(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const list =
        document.getElementById(
            "leaderboard-list"
        );


    const tabs =
        document.querySelectorAll(
            ".leaderboard-tab"
        );


    const valueTitle =
        document.getElementById(
            "leaderboard-value-title"
        );


    const refreshButton =
        document.getElementById(
            "leaderboard-refresh"
        );


    let currentType =
        "level";


    let refreshTimer =
        null;


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       RANK CLASS
    ===================================================== */

    function getRankClass(
        rank
    ) {

        if (
            rank === 1
        ) {

            return "top-one";

        }


        if (
            rank === 2
        ) {

            return "top-two";

        }


        if (
            rank === 3
        ) {

            return "top-three";

        }


        return "";

    }


    /* =====================================================
       MEDAL
    ===================================================== */

    function getMedal(
        rank
    ) {

        if (
            rank === 1
        ) {

            return "🥇";

        }


        if (
            rank === 2
        ) {

            return "🥈";

        }


        if (
            rank === 3
        ) {

            return "🥉";

        }


        return "🏅";

    }


    /* =====================================================
       NUMBER
    ===================================================== */

    function formatNumber(
        value
    ) {

        return Number(
            value ?? 0
        ).toLocaleString(
            "en-US"
        );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderLeaderboard(
        players
    ) {

        if (
            !players.length
        ) {

            list.innerHTML = `

                <div
                    class="leaderboard-state"
                >
                    🏆 هنوز بازیکنی برای نمایش وجود ندارد.
                </div>

            `;

            return;

        }


        list.innerHTML =
            players
                .map(
                    player => {

                        const rank =
                            Number(
                                player.rank ??
                                0
                            );


                        const rankClass =
                            getRankClass(
                                rank
                            );


                        const medal =
                            getMedal(
                                rank
                            );


                        const username =
                            player.username ||
                            "بازیکن VEXON";


                        const value =
                            currentType === "coins"

                                ? Number(
                                    player.coins ??
                                    0
                                )

                                : Number(
                                    player.level ??
                                    1
                                );


                        const valueClass =
                            currentType === "coins"
                                ? "coins"
                                : "level";


                        const valueLabel =
                            currentType === "coins"
                                ? "🪙"
                                : "LV";


                        return `

                            <article
                                class="
                                    leaderboard-row
                                    ${rankClass}
                                "
                            >

                                <div
                                    class="leaderboard-rank"
                                >

                                    <div
                                        class="leaderboard-medal"
                                    >
                                        ${medal}
                                    </div>


                                    <span
                                        class="
                                            leaderboard-rank-number
                                        "
                                    >
                                        #${rank}
                                    </span>

                                </div>


                                <div
                                    class="leaderboard-user"
                                >

                                    <div
                                        class="leaderboard-avatar"
                                    >
                                        👤
                                    </div>


                                    <div
                                        class="
                                            leaderboard-user-info
                                        "
                                    >

                                        <span
                                            class="
                                                leaderboard-username
                                            "
                                        >
                                            ${escapeHtml(
                                                username
                                            )}
                                        </span>


                                        <span
                                            class="
                                                leaderboard-subtitle
                                            "
                                        >
                                            بازیکن VEXON
                                        </span>

                                    </div>

                                </div>


                                <div
                                    class="
                                        leaderboard-value
                                        ${valueClass}
                                    "
                                >

                                    <span>
                                        ${valueLabel}
                                    </span>

                                    <strong>
                                        ${formatNumber(
                                            value
                                        )}
                                    </strong>

                                </div>

                            </article>

                        `;

                    }
                )
                .join("");

    }


    /* =====================================================
       LOAD
    ===================================================== */

    async function loadLeaderboard(
        silent = false
    ) {

        if (
            !silent
        ) {

            list.innerHTML = `

                <div
                    class="leaderboard-state"
                >
                    ⏳ در حال دریافت لیدربورد...
                </div>

            `;

        }


        try {

            const response =
                await fetch(
                    `/api/leaderboard?type=${encodeURIComponent(
                        currentType
                    )}&limit=50`,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "دریافت لیدربورد انجام نشد."
                );

            }


            const players =
                Array.isArray(
                    data.leaderboard
                )
                    ? data.leaderboard
                    : [];


            renderLeaderboard(
                players
            );


        } catch (
            error
        ) {

            console.error(
                "LEADERBOARD_ERROR",
                error
            );


            list.innerHTML = `

                <div
                    class="
                        leaderboard-state
                        leaderboard-error
                    "
                >

                    ❌
                    ${escapeHtml(
                        error.message ||
                        "ارتباط با لیدربورد برقرار نشد."
                    )}

                    <br>

                    لطفاً دوباره امتحان کن.

                </div>

            `;

        }

    }


    /* =====================================================
       CHANGE TAB
    ===================================================== */

    tabs.forEach(
        tab => {

            tab.addEventListener(
                "click",
                async () => {

                    const type =
                        tab.dataset.type;


                    if (
                        type !== "level" &&
                        type !== "coins"
                    ) {

                        return;

                    }


                    currentType =
                        type;


                    tabs.forEach(
                        item => {

                            const active =
                                item === tab;


                            item.classList.toggle(
                                "active",
                                active
                            );


                            item.setAttribute(
                                "aria-selected",
                                String(
                                    active
                                )
                            );

                        }
                    );


                    valueTitle.textContent =
                        type === "coins"
                            ? "Coins"
                            : "Level";


                    await loadLeaderboard();

                }
            );

        }
    );


    /* =====================================================
       REFRESH
    ===================================================== */

    refreshButton.addEventListener(
        "click",
        async () => {

            refreshButton.disabled =
                true;


            refreshButton.textContent =
                "⏳ در حال بروزرسانی...";


            try {

                await loadLeaderboard(
                    true
                );

            } finally {

                refreshButton.disabled =
                    false;


                refreshButton.textContent =
                    "🔄 بروزرسانی";

            }

        }
    );


    /* =====================================================
       FIRST LOAD
    ===================================================== */

    loadLeaderboard();


    /* =====================================================
       AUTO UPDATE
    ===================================================== */

    refreshTimer =
        setInterval(
            () => {

                loadLeaderboard(
                    true
                );

            },
            30000
        );


    /* =====================================================
       VISIBILITY
    ===================================================== */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (
                document.visibilityState ===
                "visible"
            ) {

                loadLeaderboard(
                    true
                );

            }

        }
    );


    /* =====================================================
       CLEANUP
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (
                refreshTimer
            ) {

                clearInterval(
                    refreshTimer
                );

            }

        }
    );

})();

</script>


</body>

</html>
