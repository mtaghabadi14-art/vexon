    <style>

        /* =================================================
           NEWS DETAIL
        ================================================= */

        .news-detail-page {

            position:
                relative;

            z-index:
                2;

            width:
                min(
                    950px,
                    92%
                );

            margin:
                0 auto;

            padding:
                55px 0 100px;

        }


        .news-detail-card {

            overflow:
                hidden;

            padding:
                0 0 35px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

            border-radius:
                26px;

            background:
                rgba(
                    5,
                    9,
                    17,
                    .82
                );

            backdrop-filter:
                blur(
                    18px
                );

            box-shadow:
                0 0 45px
                rgba(
                    0,
                    255,
                    157,
                    .06
                );

        }


        .news-detail-image {

            width:
                100%;

            max-height:
                500px;

            object-fit:
                cover;

            display:
                block;

        }


        .news-detail-placeholder {

            height:
                280px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                70px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        0,
                        255,
                        157,
                        .07
                    ),
                    rgba(
                        120,
                        70,
                        255,
                        .12
                    )
                );

        }


        .news-detail-content {

            padding:
                30px 35px 0;

        }


        .news-detail-category {

            display:
                inline-block;

            padding:
                6px 10px;

            margin-bottom:
                14px;

            border-radius:
                999px;

            font-size:
                11px;

            color:
                #bfffe8;

            background:
                rgba(
                    0,
                    255,
                    157,
                    .08
                );

            border:
                1px solid
                rgba(
                    0,
                    255,
                    157,
                    .14
                );

        }


        .news-detail-title {

            margin:
                0 0 15px;

            font-size:
                clamp(
                    25px,
                    4vw,
                    42px
                );

            line-height:
                1.5;

        }


        .news-detail-meta {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                10px 18px;

            margin-bottom:
                25px;

            font-size:
                11px;

            opacity:
                .52;

        }


        .news-detail-text {

            font-size:
                16px;

            line-height:
                2.25;

            white-space:
                pre-line;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .88
                );

        }


        .news-detail-back {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                20px;

            padding:
                10px 15px;

            border-radius:
                12px;

            color:
                white;

            text-decoration:
                none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .news-detail-back:hover {

            transform:
                translateY(
                    -2px
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    .09
                );

        }


        .news-detail-loading,
        .news-detail-error {

            padding:
                50px 20px;

            text-align:
                center;

            opacity:
                .65;

        }


        .news-detail-error {

            color:
                #ffbdc5;

        }


        /* =================================================
           REMOVE OLD MOBILE NAV
        ================================================= */

        .mobile-bottom-nav {

            display:
                none !important;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 900px
        ) {

            .news-detail-page {

                padding-top:
                    30px;

                padding-bottom:
                    70px;

            }

        }


        @media (
            max-width: 600px
        ) {

            .news-detail-page {

                width:
                    94%;

                padding-top:
                    25px;

            }


            .news-detail-content {

                padding:
                    22px 18px 0;

            }


            .news-detail-title {

                font-size:
                    25px;

            }


            .news-detail-text {

                font-size:
                    14px;

                line-height:
                    2.1;

            }


            .news-detail-placeholder {

                height:
                    200px;

                font-size:
                    55px;

            }

        }

    </style>

<body>

</div>


<!-- =====================================================

        VE<span class="logo-x">X</span>ON

    </a>


    <!--
        منوی قدیمی عمداً خالی است.
        vexon-nav.js منوی جدید را می‌سازد.
    -->

    <nav
        class="nav-links"
    ></nav>


    <!-- =================================================
         PROFILE
    ================================================== -->

    <a
        href="login.html"

    >

        <div
            class="header-profile-icon"
        >
            👤
        </div>


        <div
            class="header-player-info"
        >

            <strong>
                ...
            </strong>


            <div
                class="header-xp-bar"
                style="
                    display:none;
                "
            >

                <div
                    class="header-xp-fill"
                ></div>

            </div>


            <span>
                در حال بررسی حساب...
            </span>

        </div>


        <b>
            ‹
        </b>

    </a>

</header>


<!-- =====================================================
     NEWS DETAIL
===================================================== -->

<main
    class="news-detail-page"
>


    <a
        href="news.html"
        class="news-detail-back"
    >

        ←
        برگشت به اخبار

    </a>


    <article
        id="news-detail"
        class="news-detail-card"
    >

        <div
            class="news-detail-loading"
        >

            ⏳
            در حال دریافت خبر...

        </div>

    </article>

</main>


<!-- =====================================================
     OLD MOBILE NAV REMOVED
===================================================== -->


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script
    src="../script.js"
></script>


<script
    src="../vexon-nav.js"
></script>


<script>

(async function () {

    "use strict";


    const detail =
        document.getElementById(
            "news-detail"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(
        value
    ) {

        if (
            !value
        ) {

            return "";

        }


        try {

            return new Intl.DateTimeFormat(
                "fa-IR",
                {
                    dateStyle:
                        "full",

                    timeStyle:
                        "short"
                }
            ).format(
                new Date(
                    value
                )
            );

        } catch {

            return value;

        }

    }


    /* =====================================================
       NO ID
    ===================================================== */

    if (
        !id
    ) {

        detail.innerHTML = `

            <div
                class="news-detail-error"
            >

                ❌
                شناسه خبر پیدا نشد.

            </div>

        `;

        return;

    }


    /* =====================================================
       LOAD NEWS
    ===================================================== */

    try {

        const response =
            await fetch(
                `/api/news/${encodeURIComponent(
                    id
                )}`,
                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.news
        ) {

            throw new Error(
                data.message ||
                "خبر پیدا نشد."
            );

        }


        const news =
            data.news;


        document.title =
            `VEXON | ${news.title}`;


        /* =================================================
           IMAGE
        ================================================= */

        const image =
            news.image_url

                ? `

                    <img
                        class="news-detail-image"
                        src="${escapeHtml(
                            news.image_url
                        )}"
                        alt="${escapeHtml(
                            news.title
                        )}"
                        loading="eager"
                    >

                  `

                : `

                    <div
                        class="news-detail-placeholder"
                    >
                        📢
                    </div>

                  `;


        /* =================================================
           RENDER
        ================================================= */

        detail.innerHTML = `

            ${image}


            <div
                class="news-detail-content"
            >


                <span
                    class="news-detail-category"
                >

                    🏷️
                    ${escapeHtml(
                        news.category ||
                        "عمومی"
                    )}

                </span>


                <h1
                    class="news-detail-title"
                >

                    ${escapeHtml(
                        news.title
                    )}

                </h1>


                <div
                    class="news-detail-meta"
                >

                    ${
                        news.author_username

                            ? `

                                <span>
                                    👤
                                    ${escapeHtml(
                                        news.author_username
                                    )}
                                </span>

                              `

                            : ""
                    }


                    <span>

                        📅
                        ${escapeHtml(
                            formatDate(
                                news.published_at ||
                                news.created_at
                            )
                        )}

                    </span>

                </div>


                <div
                    class="news-detail-text"
                >

                    ${escapeHtml(
                        news.content
                    )}

                </div>

            </div>

        `;


    } catch (
        error
    ) {

        console.error(
            "NEWS_DETAIL_ERROR:",
            error
        );


        detail.innerHTML = `

            <div
                class="news-detail-error"
            >

                ❌

                ${escapeHtml(
                    error.message ||
                    "دریافت خبر ناموفق بود."
                )}

                <br><br>


                <a
                    href="news.html"
                    class="news-detail-back"
                >

                    ←
                    برگشت به اخبار

                </a>

            </div>

        `;

    }

})();

</script>
